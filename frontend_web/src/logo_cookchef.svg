<?xml version="1.0" encoding="UTF-8"?>
<!-- A playful, modern chef's hat on a pan logo, flat style for web -->
<svg width="62" height="62" viewBox="0 0 62 62" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Pan -->
  <ellipse cx="31" cy="51" rx="20" ry="8" fill="#4E473E" />
  <ellipse cx="31" cy="53.5" rx="14" ry="5.5" fill="#242014" opacity="0.27"/>
  <rect x="8" y="49" width="46" height="6" rx="3" fill="#676058" />
  <ellipse cx="31" cy="51" rx="18" ry="6.5" fill="#837B70"/>
  <!-- Handle -->
  <rect x="51" y="47.5" width="9" height="3.4" rx="1.5" fill="#4E473E" transform="rotate(-7 51 47.5)"/>
  <ellipse cx="60.3" cy="48.7" rx="1.3" ry="1.5" fill="#838FA7"/>
  <rect x="2" y="48.5" width="9" height="3.4" rx="1.5" fill="#4E473E" transform="rotate(7 2 48.5)"/>
  <ellipse cx="1.7" cy="49.2" rx="1.3" ry="1.5" fill="#838FA7"/>
  <!-- CHEF'S HAT base -->
  <ellipse cx="31" cy="27" rx="15" ry="10" fill="#fff3e4" stroke="#E87A41" stroke-width="2.2"/>
  <ellipse cx="31" cy="26" rx="13" ry="7.5" fill="#fff" stroke="#ffdfba" stroke-width="1.7"/>
  <!-- Poof shapes for chef hat -->
  <ellipse cx="18" cy="23.5" rx="4" ry="3.5" fill="#fff6e7" stroke="#e1bb87" stroke-width="1"/>
  <ellipse cx="44" cy="23.5" rx="4" ry="3.5" fill="#fff6e7" stroke="#e1bb87" stroke-width="1"/>
  <ellipse cx="31" cy="18" rx="8" ry="7" fill="#fffdec" stroke="#ffe9a3" stroke-width="1"/>
  <!-- Shadow highlight/hat decor -->
  <ellipse cx="31" cy="27" rx="9" ry="3" fill="#faedd7" fill-opacity="0.5"/>
  <!-- Blush dots for 'face' (playful) -->
  <ellipse cx="24.7" cy="33" rx="1" ry="0.7" fill="#ffbcad"/>
  <ellipse cx="37.4" cy="33" rx="1" ry="0.7" fill="#ffbcad"/>
</svg>
